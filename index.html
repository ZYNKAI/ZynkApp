:root[data-theme="light"]{--bg:#f5f6fb;--bg2:#fff;--card:#fff;--line:#e0e3f0;--tx:#12141f;--mut:#5d6380;--glass:#0000000a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 15% 5%,#8b5cf633,transparent 70%),radial-gradient(500px 400px at 90% 20%,#22d3ee22,transparent 70%);z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:22px 20px 60px}
nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Sora,sans-serif;font-weight:800;letter-spacing:4px;font-size:18px;display:flex;align-items:center;gap:10px}
.logo img{width:38px;height:38px;border-radius:10px;display:block;box-shadow:0 0 18px #8b5cf688}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--line);padding:6px 12px;border-radius:99px;background:var(--glass)}
.hero{text-align:center;padding:70px 0 50px}
.hero small{color:var(--b);letter-spacing:3px;font-size:12px;font-weight:500}
h1{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(40px,8vw,84px);line-height:1;margin:14px 0;letter-spacing:-1px}
h1 span{background:linear-gradient(120deg,var(--a),var(--b) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:520px;margin:0 auto;font-size:17px;line-height:1.6}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 18px}
.sec h2{font-family:Sora,sans-serif;font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{position:relative;border-radius:22px;padding:1px;background:linear-gradient(160deg,var(--line),transparent 60%);cursor:pointer;transition:transform .25s}
.card:hover{transform:translateY(-6px)}
.card:hover .in{box-shadow:0 20px 50px -20px var(--c)}
.in{border-radius:21px;background:var(--card);overflow:hidden;height:100%;transition:box-shadow .25s}
.cover{height:150px;display:grid;place-items:center;font-size:62px;background:radial-gradient(circle at 30% 20%,var(--c),transparent 75%),linear-gradient(135deg,#1a1d2e,#0b0d16)}
.body{padding:18px 20px 22px}
.tag{font-size:11px;letter-spacing:2px;color:var(--c);font-weight:600}
.body h3{font-family:Sora,sans-serif;margin:6px 0;font-size:20px}
.body p{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.5}
.play{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(120deg,var(--a),var(--b));padding:10px 18px;border-radius:12px}
.soon{cursor:default;opacity:.6}.soon:hover{transform:none}
.soon .cover{font-size:44px;filter:grayscale(1)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:60px}
#sheet{position:fixed;inset:0;z-index:9;background:#000a;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
#sheet.on{display:flex}
.box{width:100%;max-width:640px;max-height:90%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.box .cover{height:120px}.box .body{padding:22px 26px 28px}
.box h4{font-size:11px;letter-spacing:2px;color:var(--mut);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass)}
.rk{display:grid;grid-template-columns:60px 1fr;gap:4px 10px;font-size:14px;color:var(--mut)}.rk b{color:var(--c)}
.x{float:right;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.big{border:0;cursor:pointer;font:inherit;margin-top:24px;font-size:15px;padding:13px 26px}
#player{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#player.on{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.bar button{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--glass);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
.bar b{font-family:Sora,sans-serif;font-size:15px}
#frame{flex:1;border:0;width:100%;background:#0f1117;padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body>

min-height:26px;margin:10px auto 0;max-width:700px;font-style:italic;color:#fbbf24;transition:opacity .3s}\nmain{display:flex;gap:14px;padding:12px;align-items:flex-start}\naside{width:290px;flex:none;background:var(--card);border-radius:14px;padding:12px;max-height:80vh;overflow:auto;border:1px solid var(--line)}\naside h2,.side h2{font-size:13px;letter-spacing:2px;color:var(--mut);margin:4px 0 10px}\n.sub{border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:grab;color:#fff;font-size:13px;box-shadow:0 2px 6px #0006;transition:transform .15s,box-shadow .15s;border:2px solid transparent}\n.sub:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 14px #000a}\n.sub.sel{border-color:#fff}\n.sub b{display:block;font-size:14px}.sub small{opacity:.9}\n.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\nbutton{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;background:#2c3147;color:var(--tx);transition:transform .15s,background .15s}\nbutton:hover{transform:translateY(-1px);background:#3a4160}\nbutton.red{background:#dc2626}button.red:hover{background:#ef4444}\n.right{flex:1;min-width:0}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}\n.tools label{font-size:13px;color:var(--mut)}\n.wrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:8px;border:1px solid var(--line)}\n.grid{display:grid;grid-template-columns:52px repeat(5,minmax(120px,1fr));min-width:700px}\n.hd{text-align:center;font-weight:800;padding:6px;font-size:13px}\n.times div{height:26px;font-size:11px;color:var(--mut);text-align:right;padding-right:6px;line-height:26px}\n.col{position:relative;height:494px;border-left:1px solid var(--line);background:repeating-linear-gradient(#0000 0 25px,var(--line) 25px 26px)}\n.col.lock{background:repeating-linear-gradient(45deg,#0000 0 6px,#ffffff08 6px 12px)}\n.lockz{position:absolute;left:0;right:0;bottom:0;background:#0006;pointer-events:none;display:none;align-items:center;justify-content:center;color:var(--mut);font-size:12px}\n.blk{position:absolute;left:3px;right:3px;border-radius:8px;color:#fff;padding:3px 7px;font-size:12px;overflow:hidden;cursor:grab;box-shadow:0 3px 8px #0008;animation:in .25s;line-height:1.2;z-index:2}\n.blk:hover{filter:brightness(1.15)}\n.blk b{display:block;font-size:12px}.blk i{font-style:normal;opacity:.85;font-size:11px}\n.blk .x{position:absolute;top:2px;right:4px;cursor:pointer;background:#0006;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px}\n@keyframes in{from{transform:scale(.7);opacity:0}}\n.ghost{position:absolute;left:3px;right:3px;border-radius:8px;background:#22c55e55;border:2px dashed #22c55e;z-index:3;pointer-events:none;display:none}\n.ghost.bad{background:#ef444455;border-color:#ef4444}\n.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}\n.side>div{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}\n.ach{padding:6px 8px;border-radius:8px;margin-bottom:5px;font-size:13px;background:#0003;color:var(--mut)}\n.ach.ok{background:#16a34a33;color:var(--tx)}\n#ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10;overflow:auto;padding:16px}\n#box{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:24px;text-align:center;border:2px solid #ef4444;box-shadow:0 0 50px #ef444466;animation:in .4s;max-height:95vh;overflow:auto}\n#big{font-size:64px;font-weight:900;color:#ef4444}\n.st{text-align:left;font-size:14px;margin:12px 0;line-height:1.6}\n.st li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0}\n@media(max-width:900px){main{flex-direction:column}aside{width:100%;max-height:260px}.right{width:100%}}\n<\/style><\/head><body>\n<header><h1>💀 LE PIRE EMPLOI DU TEMPS<\/h1><p>Crée l'emploi du temps que personne ne voudrait avoir.<\/p>\n<div id=\"score\">Indice de souffrance : <span id=\"sc\">0<\/span> 💀<\/div><div id=\"msg\"><\/div><\/header>\n<main>\n<aside><h2>MATIÈRES DISPONIBLES<\/h2>\n<div class=\"btns\"><button onclick=\"randLesson()\">🎲 Générer un cours aléatoire<\/button><\/div>\n<div id=\"pal\"><\/div><p style=\"font-size:11px;color:var(--mut)\">Glisse une carte dans la grille, ou touche une carte puis une case.<\/p><\/aside>\n<div class=\"right\">\n<div class=\"tools\"><button class=\"red\" onclick=\"finish()\">💀 Calculer mon score<\/button><button onclick=\"gen()\">🎲 Générer aléatoirement<\/button><button onclick=\"clearAll()\">🗑️ Tout effacer<\/button><button onclick=\"restart()\">🔄 Recommencer<\/button>\n<label><input type=\"checkbox\" id=\"wed\" checked onchange=\"wedChange()\"> Mercredi : fin à midi<\/label><\/div>\n<div class=\"wrap\"><div class=\"grid\" id=\"grid\"><\/div><\/div>\n<div class=\"side\"><div><h2>🏆 SUCCÈS<\/h2><div id=\"ach\"><\/div><\/div><div><h2>📋 POURQUOI C'EST HORRIBLE<\/h2><div id=\"why\" style=\"font-size:13px;color:var(--mut)\">Place des cours…<\/div><\/div><\/div>\n<\/div><\/main>\n<div id=\"ov\"><div id=\"box\"><div>💀 INDICE DE SOUFFRANCE<\/div><div id=\"big\">0<\/div><h2 id=\"lvl\"><\/h2><p id=\"quote\" style=\"font-style:italic\"><\/p><ul class=\"st\" id=\"stats\" style=\"padding:0;list-style:none\"><\/ul><div id=\"reasons\" class=\"st\"><\/div><button class=\"red\" onclick=\"restart();ov.style.display='none'\">🔄 Créer un nouvel enfer<\/button> <button onclick=\"ov.style.display='none'\">↩️ Continuer<\/button><\/div><\/div>\n<script>\nconst N=19,RH=26,D=[\"Lundi\",\"Mardi\",\"Mercredi\",\"Jeudi\",\"Vendredi\"];\n// key,nom,prof,durée(créneaux),emoji,couleur,base,tag,contrôle(0/1/2)\nconst L=[[\"maths\",\"Mathématiques\",\"Mme Dupont\",4,\"➗\",\"#dc2626\",25,\"math\",0],[\"fr\",\"Français\",\"M. Martin\",4,\"📖\",\"#d97706\",15,\"fr\",0],[\"hg\",\"Histoire-Géographie\",\"Mme Bernard\",3,\"🌍\",\"#a16207\",12,\"\",0],[\"phys\",\"Physique-Chimie\",\"M. Lefèvre\",4,\"⚗️\",\"#7c3aed\",25,\"phys\",0],[\"svt\",\"SVT\",\"Mme Moreau\",3,\"🧬\",\"#16a34a\",10,\"\",0],[\"ang\",\"Anglais\",\"Mme Laurent\",2,\"🇬🇧\",\"#2563eb\",8,\"\",0],[\"esp\",\"Espagnol\",\"M. Garcia\",2,\"🇪🇸\",\"#ea580c\",8,\"\",0],[\"eps\",\"EPS\",\"M. Petit\",4,\"🏃\",\"#0d9488\",15,\"eps\",0],[\"philo\",\"Philosophie\",\"Mme Girard\",4,\"🦉\",\"#4f46e5\",20,\"philo\",0],[\"info\",\"Informatique\",\"M. Leroy\",3,\"💻\",\"#0891b2\",5,\"\",0],[\"arts\",\"Arts plastiques\",\"Mme Fontaine\",2,\"🎨\",\"#db2777\",3,\"\",0],[\"mus\",\"Musique\",\"M. Rousseau\",2,\"🎵\",\"#c026d3\",3,\"\",0],[\"tech\",\"Technologie\",\"M. Roux\",3,\"🔧\",\"#64748b\",6,\"\",0],\n[\"cm\",\"Contrôle de maths\",\"Mme Dupont\",4,\"📝\",\"#b91c1c\",40,\"math\",1],[\"cs\",\"Contrôle surprise\",\"M. Lefèvre\",2,\"🧠\",\"#991b1b\",60,\"\",2],[\"ds\",\"DS de français\",\"M. Martin\",4,\"✍️\",\"#c2410c\",40,\"fr\",1],[\"os\",\"Oral surprise\",\"Mme Laurent\",2,\"🎤\",\"#be123c\",50,\"\",2],[\"etude\",\"Étude\",\"M. Roux\",2,\"📚\",\"#475569\",4,\"\",0],[\"perm\",\"Permanence\",\"Mme Fontaine\",2,\"🪑\",\"#52525b\",4,\"\",0],\n[\"tot\",\"😴 Cours beaucoup trop tôt\",\"M. Matin\",2,\"😴\",\"#1e3a8a\",20,\"\",0],[\"deux\",\"📚 2 heures de cours\",\"Prof. Sadique\",4,\"📚\",\"#92400e\",15,\"\",0],[\"inter\",\"📝 Interro non annoncée\",\"M. Lefèvre\",1,\"📝\",\"#9f1239\",45,\"\",2],[\"epsd\",\"🏃 EPS juste après le déjeuner\",\"M. Petit\",3,\"🤢\",\"#0f766e\",20,\"eps\",0],[\"trajet\",\"🚌 Trajet inutile\",\"Le bus\",2,\"🚌\",\"#3f3f46\",20,\"\",0],[\"trou\",\"⏰ Trou de 30 minutes\",\"Personne\",1,\"⏰\",\"#27272a\",20,\"\",0],[\"perm2\",\"🪑 Permanence interminable\",\"Mme Fontaine\",4,\"🪑\",\"#44403c\",25,\"\",0]];\nconst LK={};L.forEach(l=>LK[l[0]]={k:l[0],n:l[1],p:l[2],d:l[3],e:l[4],c:l[5],b:l[6],t:l[7],x:l[8]});\nconst t2s=s=>{const m=8*60+s*30;return Math.floor(m/60)+\"h\"+String(m%60).padStart(2,\"0\")};\nlet blocks=[],nid=1,drag=null,sel=null,unlocked={},first=true;\nconst $=id=>document.getElementById(id);\n// palette\n$(\"pal\").innerHTML=L.map(l=>{const o=LK[l[0]];return `<div class=\"sub\" draggable=\"true\" data-k=\"${o.k}\" style=\"background:${o.c}\"><b>${o.e} ${o.n.replace(/^\\S+ (?=[A-Za-zÀ-ÿ0-9])/u,l[1].match(/^[^\\wÀ-ÿ]/u)?\"\":\"\")}<\/b><small>${o.p} · ${o.d/2}h · 💀 ~${o.b+(o.x?o.x*25:0)}<\/small><\/div>`}).join(\"\");\ndocument.querySelectorAll(\".sub\").forEach(e=>{e.ondragstart=ev=>{drag={t:\"s\",k:e.dataset.k,off:0};ev.dataTransfer.setData(\"text\",\"x\");beep(300)};e.ondragend=()=>{drag=null;hideGhost()};e.onclick=()=>{sel=sel===e.dataset.k?null:e.dataset.k;document.querySelectorAll(\".sub\").forEach(x=>x.classList.toggle(\"sel\",x.dataset.k===sel))}});\n// grille\nlet h='<div><\/div>'+D.map(d=>`<div class=\"hd\">${d}<\/div>`).join(\"\");\nh+='<div class=\"times\">'+Array.from({length:N},(_,i)=>`<div>${i%2==0?t2s(i):\"\"}<\/div>`).join(\"\")+\"<\/div>\";\nfor(let d=0;d<5;d++)h+=`<div class=\"col\" data-d=\"${d}\"><div class=\"ghost\"><\/div><div class=\"lockz\"><\/div><\/div>`;\n$(\"grid\").innerHTML=h;\nconst cols=[...document.querySelectorAll(\".col\")];\nconst wedNoon=()=>$(\"wed\").checked, lim=d=>d==2&&wedNoon()?8:N;\nfunction free(d,s,len,ig){if(s<0||s+len>lim(d))return false;return !blocks.some(b=>b.id!=ig&&b.d==d&&s<b.s+LK[b.k].d&&b.s<s+len)}\nfunction slotOf(col,ev){const r=col.getBoundingClientRect();return Math.floor((ev.clientY-r.top)/RH)}\nfunction hideGhost(){document.querySelectorAll(\".ghost\").forEach(g=>g.style.display=\"none\")}\ncols.forEach((col,d)=>{\n col.ondragover=ev=>{if(!drag)return;ev.preventDefault();const len=LK[drag.k].d,s=slotOf(col,ev)-drag.off,g=col.querySelector(\".ghost\");hideGhost();g.style.display=\"block\";g.style.top=s*RH+\"px\";g.style.height=len*RH+\"px\";g.classList.toggle(\"bad\",!free(d,s,len,drag.id))};\n col.ondrop=ev=>{ev.preventDefault();hideGhost();if(!drag)return;const s=slotOf(col,ev)-drag.off;if(drag.t==\"s\")place(drag.k,d,s);else move(drag.id,d,s);drag=null};\n col.onclick=ev=>{if(sel&&ev.target===col||ev.target.classList.contains(\"ghost\"))place(sel,d,slotOf(col,ev))};\n});\nfunction sound(){}\nfunction beep(f){try{const a=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type=\"square\";g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.stop(a.currentTime+.15)}catch(e){}}\nfunction say(t){const m=$(\"msg\");m.style.opacity=0;setTimeout(()=>{m.textContent=t;m.style.opacity=1},120)}\nfunction place(k,d,s,quiet){if(!k||!free(d,s,LK[k].d)){if(!quiet){beep(120);say(d==2&&wedNoon()&&s>=8?\"Mercredi après-midi : fermé (décoche l'option pour l'ouvrir).\":\"Pas de place ici !\")}return false}\n const b={id:nid++,k,d,s};blocks.push(b);if(!quiet){beep(500);render();react(b)}return true}\nfunction move(id,d,s){const b=blocks.find(x=>x.id==id);if(!b||!free(d,s,LK[b.k].d,id)){beep(120);return}b.d=d;b.s=s;beep(450);render();react(b)}\nfunction del(id){blocks=blocks.filter(b=>b.id!=id);beep(200);render();say(\"Un cours en moins… c'est presque de la gentillesse.\")}\nfunction dayB(d){return blocks.filter(b=>b.d==d).sort((a,b)=>a.s-b.s)}\nfunction react(b){const o=LK[b.k],bs=dayB(b.d),i=bs.indexOf(b),pv=bs[i-1],o2=pv&&LK[pv.k];let m;\n if(o.x&&b.s==0)m=\"Ah. Tu veux vraiment souffrir.\";\n else if(o.t==\"math\"&&!o.x&&b.s==0)m=\"8h du matin. Des maths. Pourquoi ?\";\n else if(o.t==\"math\"&&pv&&pv.s+o2.d==b.s&&o2.t==\"eps\")m=\"Bonne chance pour les maths après ça.\";\n else if(o.k==\"maths\"&&o.d>=4)m=\"Mme Dupont est fière de toi. Ton cerveau beaucoup moins.\";\n else if(bs.reduce((a,x)=>a+LK[x.k].d,0)>=N)m=\"Tu viens de supprimer toute notion de pause.\";\n else if(pv&&b.s-(pv.s+o2.d)>=4)m=\"Félicitations, tu as découvert le concept de temps perdu.\";\n else if(o.x==2)m=\"Surprise ! (Pour eux. Toi, tu as tout prévu.)\";\n else m=[\"Hmm, ça fait mal. Continue.\",\"Quelqu'un va pleurer, et ce n'est pas toi.\",\"Excellent choix… pour un sadique.\",\"Les élèves te remercient. Ironiquement.\"][Math.random()*4|0];\n say(m)}\nfunction render(){cols.forEach((c,d)=>{c.querySelectorAll(\".blk\").forEach(e=>e.remove());c.classList.toggle(\"lock\",d==2&&wedNoon());const z=c.querySelector(\".lockz\");z.style.display=d==2&&wedNoon()?\"flex\":\"none\";z.style.top=8*RH+\"px\";z.textContent=\"🏫 Fermé\";});\n blocks.forEach(b=>{const o=LK[b.k],e=document.createElement(\"div\");e.className=\"blk\";e.draggable=true;e.style.cssText=`top:${b.s*RH}px;height:${o.d*RH-3}px;background:${o.c}`;\n  e.innerHTML=`<span class=\"x\">×<\/span><b>${o.n}<\/b><i>${t2s(b.s)}–${t2s(b.s+o.d)} · ${o.p}<\/i>`;\n  e.querySelector(\".x\").onclick=ev=>{ev.stopPropagation();del(b.id)};\n  e.ondragstart=ev=>{const r=e.getBoundingClientRect();drag={t:\"p\",id:b.id,k:b.k,off:Math.floor((ev.clientY-r.top)/RH)};ev.dataTransfer.setData(\"text\",\"x\")};e.ondragend=()=>{drag=null;hideGhost()};\n  cols[b.d].appendChild(e)});\n update()}\nfunction calc(){const R={},pd=[0,0,0,0,0],st={cours:blocks.length,ctrl:0,gaps:0,full:0,chains:0};\n const add=(d,l,p)=>{pd[d]+=p;R[l]=(R[l]||0)+p};const cnt={};\n for(let d=0;d<5;d++){const bs=dayB(d);let occ=0,nc=0;\n  bs.forEach((b,i)=>{const o=LK[b.k],e=b.s+o.d;occ+=o.d;cnt[o.n]=(cnt[o.n]||0)+o.d;\n   add(d,\"Intensité des cours\",o.b);\n   if(b.s==0)add(d,\"Début à 8h00\",20);\n   if(o.x){st.ctrl++;nc++;add(d,o.x==2?\"Contrôles surprise\":\"Contrôles\",o.x==2?100:30);if(d==0&&b.s==0)add(d,\"Contrôle le lundi 8h\",100);if(d==4&&e==N)add(d,\"Contrôle le vendredi soir\",100)}\n   if(e>=N-1){const v={math:60,phys:50,philo:30,fr:20}[o.t];if(v)add(d,\"Matière difficile en fin de journée\",v)}\n   if(b.k==\"epsd\"||(o.t==\"eps\"&&b.s>=9&&b.s<=11))add(d,\"EPS juste après le déjeuner\",40);\n   const n=bs[i+1];if(n){const p=LK[n.k],g=n.s-e;\n    if(g>0){st.gaps++;add(d,\"Trous dans l'emploi du temps\",g<=2?40:40+30*(g-2))}\n    else{let c=0;\n     if(o.t==\"math\"&&p.t==\"phys\")c=30;if(o.x&&p.t==\"math\"&&!p.x)c=40;if(o.t==\"eps\"&&p.t==\"math\")c=50;if(o.t==\"eps\"&&p.t==\"phys\")c=60;if(o.t==\"fr\"&&p.x)c=30;\n     if(c){st.chains++;add(d,\"Enchaînements horribles\",c)}\n     if(n.k==b.k&&!o.x)add(d,\"Double heure de la même matière\",30);\n     const n2=bs[i+2];if(n2&&n2.s==n.s+p.d&&new Set([b.k,n.k,n2.k]).size==3&&n2.s+LK[n2.k].d-b.s<=6){st.chains++;add(d,\"3 matières en 3 heures\",50)}}}});\n  if(nc>=2)add(d,\"Deux contrôles le même jour\",100);\n  if(occ)add(d,\"Journées chargées\",occ*2);\n  if(occ>=N){st.full++;add(d,\"Journée complète 8h–17h30\",100)}\n  if(d==2&&!wedNoon()&&bs.some(b=>b.s>=8)){add(d,\"MAIS QUI FAIT ÇA ??? (mercredi après-midi)\",150);if(bs.some(b=>b.s+LK[b.k].d==N))add(d,\"MAIS QUI FAIT ÇA ??? (jusqu'à 17h30)\",150)}}\n const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];\n return{total:pd.reduce((a,b)=>a+b,0),pd,R,st,top:top?top[0]:\"—\",hard:pd.indexOf(Math.max(...pd))}}\nconst ACH=[[\"Le lundi parfait\",\"Contrôle à 8h00 le lundi\",()=>blocks.some(b=>b.d==0&&b.s==0&&LK[b.k].x)],[\"La journée infinie\",\"Remplir une journée de 8h à 17h30\",c=>c.st.full>0],[\"Le cerveau fondu\",\"4h de matières difficiles dans une journée\",()=>[0,1,2,3,4].some(d=>dayB(d).filter(b=>[\"math\",\"phys\",\"philo\"].includes(LK[b.k].t)||LK[b.k].x).reduce((a,b)=>a+LK[b.k].d,0)>=8)],[\"Le vendredi maudit\",\"Contrôle de 16h30 à 17h30 vendredi\",()=>blocks.some(b=>b.d==4&&LK[b.k].x&&b.s+LK[b.k].d==N&&LK[b.k].d>=2)],[\"Aucun respect\",\"EPS juste avant un contrôle\",()=>[0,1,2,3,4].some(d=>{const bs=dayB(d);return bs.some((b,i)=>bs[i+1]&&LK[b.k].t==\"eps\"&&LK[bs[i+1].k].x&&b.s+LK[b.k].d==bs[i+1].s)})],[\"L'enfer absolu\",\"Atteindre 1000 points\",c=>c.total>=1000]];\nconst LV=[[1500,\"💀🔥\",\"TU DÉTESTES L'ÉCOLE À CE POINT ???\",\"Même les murs du lycée ont demandé leur mutation.\"],[1000,\"🔥\",\"EMPLOI DU TEMPS ABSOLUMENT IMMONDE\",\"Tu as réussi à créer un emploi du temps que même le principal voudrait éviter.\"],[800,\"☠️\",\"Catastrophe nationale\",\"Le ministère est en réunion de crise.\"],[600,\"💀\",\"Enfer scolaire\",\"Les élèves écrivent déjà leur lettre de démission.\"],[400,\"😨\",\"Très mauvais emploi du temps\",\"Respectable, mais on peut faire pire.\"],[200,\"😐\",\"Ça commence à faire mal\",\"Il y a encore de l'espoir. Trop, même.\"],[0,\"😊\",\"Emploi du temps plutôt normal\",\"Tu n'es pas assez méchant(e).\"]];\nconst lvl=s=>LV.find(l=>s>=l[0]);\nfunction update(){const c=calc();$(\"sc\").textContent=c.total;const e=$(\"score\");e.classList.add(\"pop\");setTimeout(()=>e.classList.remove(\"pop\"),200);\n const w=Object.entries(c.R).sort((a,b)=>b[1]-a[1]);$(\"why\").innerHTML=w.length?w.map(([l,p])=>`<div>+${p} · ${l}<\/div>`).join(\"\"):\"Place des cours…\";\n $(\"ach\").innerHTML=ACH.map(a=>{if(!unlocked[a[0]]&&a[2](c)){unlocked[a[0]]=1;setTimeout(()=>{beep(800);say(\"🏆 Succès débloqué : \"+a[0]+\" !\")},400)}return `<div class=\"ach ${unlocked[a[0]]?\"ok\":\"\"}\">${unlocked[a[0]]?\"🏆\":\"🔒\"} <b>${a[0]}<\/b> — ${a[1]}<\/div>`}).join(\"\");\n window._c=c}\nfunction wedChange(){if(wedNoon())blocks=blocks.filter(b=>!(b.d==2&&b.s+LK[b.k].d>8));render();say(wedNoon()?\"Le mercredi se termine à midi. Quelle faiblesse.\":\"Mercredi après-midi ouvert. Le chaos est à portée de main.\")}\nfunction clearAll(){blocks=[];render();say(\"Page blanche. Tout est à refaire (en pire).\")}\nfunction restart(){blocks=[];unlocked={};sel=null;$(\"wed\").checked=true;document.querySelectorAll(\".sub\").forEach(x=>x.classList.remove(\"sel\"));render();say(\"On recommence. Sois plus cruel(le) cette fois.\")}\nfunction randLesson(){const k=L[Math.random()*L.length|0][0];sel=k;document.querySelectorAll(\".sub\").forEach(x=>x.classList.toggle(\"sel\",x.dataset.k===k));say(\"Cours tiré au sort : \"+LK[k].n+\" (\"+LK[k].p+\"). Touche une case pour le placer.\")}\nfunction gen(){blocks=[];const hard=[\"maths\",\"phys\",\"eps\",\"cm\",\"cs\",\"ds\",\"os\",\"inter\",\"philo\",\"maths\",\"phys\",\"fr\"],all=L.map(l=>l[0]);\n for(let d=0;d<5;d++){const end=lim(d);let s=0;\n  if(d==0){place(\"cm\",0,0,1);s=4}\n  for(let t=0;t<40&&s<end;t++){if(s>0&&Math.random()<.18){s+=1+(Math.random()*2|0);continue}\n   const pool=Math.random()<.7?hard:all,k=pool[Math.random()*pool.length|0];if(d==4&&0)continue;\n   if(place(k,d,s,1))s+=LK[k].d;else{const f=[...all].filter(a=>free(d,s,LK[a].d));if(!f.length)break;const k2=f[Math.random()*f.length|0];place(k2,d,s,1);s+=LK[k2].d}}\n }\n blocks=blocks.filter(b=>!(b.d==4&&b.s+LK[b.k].d>N-2));place(\"cs\",4,N-2,1);\n render();say(\"Voici ton cauchemar scolaire.\");beep(150);setTimeout(()=>beep(100),150)}\nfunction finish(){const c=calc(),l=lvl(c.total);$(\"ov\").style.display=\"flex\";$(\"lvl\").textContent=l[1]+\" \"+l[2];$(\"quote\").textContent=\"« \"+l[3]+\" »\";\n const bg=$(\"big\");let v=0;const step=Math.max(1,Math.ceil(c.total/60)),iv=setInterval(()=>{v=Math.min(c.total,v+step);bg.textContent=v.toLocaleString(\"fr-FR\");if(v>=c.total){clearInterval(iv);beep(220)}},25);\n $(\"stats\").innerHTML=[[\"Nombre de cours\",c.st.cours],[\"Nombre de contrôles\",c.st.ctrl],[\"Nombre de trous\",c.st.gaps],[\"Journées complètes\",c.st.full],[\"Enchaînements horribles\",c.st.chains],[\"Matière la plus présente\",c.top],[\"Journée la plus difficile\",c.total?D[c.hard]+\" (\"+c.pd[c.hard]+\")\":\"—\"]].map(x=>`<li><span>${x[0]}<\/span><b>${x[1]}<\/b><\/li>`).join(\"\");\n $(\"reasons\").innerHTML=\"<b>Pourquoi c'est mauvais :<\/b><br>\"+(Object.entries(c.R).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,p])=>`+${p} · ${l}`).join(\"<br>\")||\"Rien. C'est vide.\")}\nrender();say(\"Glisse des cours dans la grille. Fais-les souffrir.\");\n<\/script><\/body><\/html>\n"},{...{"id": "educonnect", "title": "EDUCONNECT", "tag": "SIMULATION · ÉCOLE", "icon": "📝", "color": "#0f9d8a", "desc": "Ton espace numérique de professeur : des copies à corriger, des notes à attribuer.", "long": "Plonge dans EDUCONNECT, un espace numérique de travail où tu joues le rôle du professeur : ouv ight:100px}.ln:hover{background:#ffe9a233}\n.gl{position:absolute;left:-46px;top:0;font:700 22px/32px \"Caveat\";color:#d0312d}\n.mg{position:absolute;right:0;top:2px;font-size:.7em;color:#d0312d;transform:rotate(-4deg);max-width:92px;line-height:1.1}\n.rat{text-decoration:line-through wavy #333}.und{text-decoration:underline;text-decoration-color:#d0312d}\n.pn{width:290px;flex:1 1 260px;max-width:340px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}.pn h3,.pn h4{margin:0 0 8px}.pn label{display:block;margin-top:10px;font-weight:600}\n.nt{display:flex;align-items:center;gap:6px}.nt input{font:700 28px \"Hanken Grotesk\";width:100px;padding:4px 8px;border:2px solid var(--ac);border-radius:8px;background:var(--bg);color:var(--ink)}\ntextarea{width:100%;height:70px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px}\n.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chips button{font-size:12px;padding:3px 7px}\n.go{width:100%;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px;font:700 15px inherit;cursor:pointer;margin:8px 0 14px}\n#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#md.s{display:flex}\n#md>div{background:var(--pn);border-radius:12px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}\n.say{font-size:19px;background:var(--bg);border-left:4px solid var(--hl);padding:10px 14px;border-radius:6px;margin:10px 0}\ntable{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:7px;text-align:left}\n#toast{position:fixed;right:14px;bottom:14px;background:var(--sd);color:#fff;padding:12px 16px;border-radius:10px;max-width:340px;display:none;z-index:10}\n@media(max-width:760px){.app{flex-direction:column}#nav{width:100%;display:flex;overflow-x:auto;border:0}#nav a{white-space:nowrap;gap:6px}.ln{padding-right:0;min-height:96px}.mg{position:static;display:block}}\n<\/style><\/head><body>\n<div id=\"top\"><span class=\"lg\">EDUCONNECT<\/span><span>Mme Delacroix · Français<\/span><small>Seconde 3 · lundi 14 octobre, 16:12<\/small><button onclick=\"alert('Vous restez connecté(e) : il reste des copies !')\">Déconnexion<\/button><\/div>\n<div class=\"app\"><nav id=\"nav\"><\/nav><main id=\"main\"><\/main><\/div>\n<div id=\"md\" onclick=\"if(event.target==this&&!lock)cm()\"><\/div><div id=\"toast\"><\/div>\n<script>\nconst $=s=>document.querySelector(s),T=[['dash','🏠 Tableau de bord'],['eleves','👨‍🎓 Élèves'],['classes','📚 Classes'],['copies','📝 Copies à corriger'],['notes','📊 Notes'],['msg','💬 Messagerie'],['set','⚙️ Paramètres']];\nconst S=[\n{p:'Lucas',n:'Martin',t:'sus',tt:'Très susceptible : pense toujours avoir mieux réussi que les autres.',ex:14,lv:11,m:1.5,r:18,fr:[15,13],ma:[12,8,14,7],f:['Gochi Hand',30,5,'#1d3f9c'],\nL:[[\"L'école nous rend libre car on apprend plein de choses utiles.\"],[\"Par exemple Napoléon a ~inventé~ créé l'école en 1789.\",\"marge: évident !\"],[\"En conclusion, c'est _clairement_ une très bonne copie.\"]],\nb:[\"QUOI ??? {n} ?! J'avais clairement au moins 14 !\",\"C'est sûr que quelqu'un a copié sur moi !\"],g:[\"Normal, j'avais dit que j'étais bon.\",\"{n}, ça confirme ce que je pensais.\"]},\n{p:'Enzo',n:'Bernard',t:'chill',tt:'Très détendu : se fiche presque de ses notes.',ex:10,lv:9,m:.4,r:5,fr:[9,10],ma:[8,11],f:['Reenie Beanie',32,3,'#444'],\nL:[[\"Bah l'école ça sert à avoir un diplome et après un job.\"],[\"Jsp trop quoi dire de plus mdr.\"],[\"Voila c'est fini on peut aller manger ?\",\"marge: 🍕\"]],\nb:[\"Ouais bof. Je peux aller en récré ?\",\"{n}... c'est pas grave, hein.\"],g:[\"Cool. Je rentre à quelle heure ?\",\"Ah tiens, {n}. Sympa.\"]},\n{p:'Thomas',n:'Dubois',t:'top',tt:'Excellent élève : furieux face à une note qu’il juge injuste.',ex:17,lv:16,m:1.2,r:8,fr:[17,16,18],ma:[16,17],f:['Caveat',23,.4,'#10206b'],\nL:[[\"Selon Kant, l'éducation est la condition de l'autonomie : _Sapere aude_.\"],[\"Toutefois, Bourdieu montre que l'école reproduit les inégalités sociales.\"],[\"Ainsi, l'école libère à condition d'être elle-même ~libre~ égalitaire.\"]],\nb:[\"{n} ? Je demande une double correction avec barème détaillé.\",\"C'est incohérent avec la rigueur de mon argumentation.\"],g:[\"{n}, c'est cohérent avec la rigueur de ma copie.\",\"Merci. J'aurais juste aimé un point de plus.\"]},\n{p:'Hugo',n:'Morel',t:'funny',tt:'Mauvais élève mais très drôle : accepte tout avec une blague.',ex:7,lv:6,m:.5,r:10,fr:[6,5,8],ma:[4,7],f:['Shadows Into Light',27,3,'#2a2a2a'],\nL:[[\"L'école rend libre... surtout à 17h30.\",\"marge: (haha)\"],[\"Platon dit que ~les profs~ le savoir rend libre, mais il n'a jamais eu de contrôle.\"],[\"Conclusion : j'ai ~oublié~ pas fini mon plan.\"]],\nb:[\"{n} ? Je l'encadre et je l'accroche dans ma chambre !\",\"Au moins c'est pas zéro. Merci, madame.\"],g:[\"{n} ?! Appelez la presse !\",\"Vous êtes sûre que c'est ma copie ?\"]},\n{p:'Nathan',n:'Lefèvre',t:'comp',tt:'Très compétitif : veut la meilleure note de la classe.',ex:15,lv:14,m:1.3,r:15,fr:[15,14],ma:[14,16],f:['Covered By Your Grace',24,1.5,'#14336b'],\nL:[[\"Thèse : l'école libère par le savoir (Kant, Rousseau).\"],[\"Antithèse : elle uniformise (Foucault, ~Durkheim~).\"],[\"Synthèse : liberté sous condition. Je vise le 18.\",\"marge: top 1\"]],\nb:[\"{n} ?! Qui a eu la meilleure note ? Je veux savoir.\",\"Je veux voir la copie du premier de la classe.\"],g:[\"{n}. Qui est devant moi ? Personne, j'espère.\",\"Je suis premier ? Dites-moi que je suis premier.\"]},\n{p:'Camille',n:'Rousseau',t:'work',tt:'Travaille beaucoup : très déçue par une note basse.',ex:14,lv:13,m:1.2,r:12,fr:[13,14,12],ma:[12,13],f:['Patrick Hand',24,1,'#5a2a7a'],\nL:[[\"Introduction : l'école transmet des savoirs et des valeurs.\"],[\"Premier ~axe~ argument : elle donne des outils pour penser.\"],[\"Deuxième argument : ... (j'ai manqué de temps).\",\"marge: 7h de révisions\"]],\nb:[\"{n}... j'ai passé tout le week-end dessus... (elle retient ses larmes)\",\"Je ne comprends pas, j'avais pourtant tout révisé.\"],g:[\"{n} ! Mes révisions ont payé, merci madame !\",\"Ouf... je respire enfin.\"]},\n{p:'Emma',n:'Girard',t:'perf',tt:'Calme mais perfectionniste : un 17 peut la contrarier.',ex:16,lv:15,m:.9,r:6,fr:[16,15,17],ma:[15,16],f:['Kalam',20,.2,'#222f55'],\nL:[[\"I. L'école émancipe : elle forme l'esprit critique (Condorcet).\"],[\"II. Mais elle normalise : le programme est imposé.\"],[\"Conclusion : une liberté à construire.\"]],\nb:[\"Pourriez-vous m'indiquer précisément où j'ai perdu des points ?\",\"{n}. Je ne suis pas en colère, juste très déçue.\"],g:[\"Merci. J'aurais pu faire mieux sur l'antithèse.\",\"{n}. Il me manque quand même quelques points, non ?\"]},\n{p:'Chloé',n:'Fontaine',t:'chat',tt:'Très bavarde : réagit énormément aux appréciations.',ex:12,lv:11,m:1,r:14,fr:[11,12,10],ma:[10,12],f:['Indie Flower',22,3,'#a1245c'],\nL:[[\"Alors déjà moi je trouve que l'école c'est important parce que ma cousine...\"],[\"Et puis les profs sont gentils (surtout vous madame !!) donc on est libre.\"],[\"D'ailleurs hier à la cantine il s'est passé un truc de fou.\",\"marge: ?!\"]],\nb:[\"MADAME {n} ?! Attendez, laissez-moi vous expliquer, j'ai plein de choses à dire !\",\"Ma cousine a eu mieux et elle a même pas fait de plan !\"],g:[\"{n} !!! Je le savais !! Je vais le dire à tout le monde !\",\"Trop bien !! Vous êtes ma prof préférée !!\"]},\n{p:'Mathis',n:'Robert',t:'silent',tt:'Discret : accumule la frustration en silence.',ex:11,lv:10,m:1,r:9,fr:[10,9,11],ma:[10,9],f:['Patrick Hand',22,2,'#333'],\nL:[[\"L'école donne des ~connaissances~ compétences et un cadre.\"],[\"Mais elle peut aussi ~enfermer~ limiter, comme l'a dit Foucault.\"],[\"(je ne sais pas comment conclure)\"]],\nb:[\"...{n}. D'accord. (il note quelque chose dans son carnet)\",\"Je n'ai rien dit. Mais j'ai tout noté.\"],g:[\"{n}. Ça va. Merci.\",\"Bon. D'accord. Merci.\"]},\n{p:'Yanis',n:'Mercier',t:'opti',tt:'Optimiste sans filtre : surestime toujours sa copie.',ex:12,lv:8,m:1.1,r:11,fr:[8,7,9],ma:[6,9],f:['Reenie Beanie',30,5,'#1a1a1a'],\nL:[[\"L'école rend libre car on est enfermé 8h par jour.\"],[\"Voltaire a écrit Candide pour libérer les élèves.\"],[\"Je pense avoir tout bon, c'est du 16 minimum.\",\"marge: GG\"]],\nb:[\"{n} ?! J'étais SÛR d'avoir au moins 16 !\",\"Y'a erreur, j'ai tout bon, relisez !\"],g:[\"Je vous avais dit que c'était du 16 minimum !\",\"{n} ! Trop fort. Je suis un génie incompris.\"]}\n].map((s,i)=>({...s,id:i,d:false,mk:[],rev:false,rh:[]}));\nconst G=[[\"Bon... c'est correct.\",\"Je pensais avoir un peu mieux, mais ça va.\"],[\"Mouais... je trouve ça un peu sévère.\",\"Je comprends pas trop cette note.\"],[\"Attendez, madame, vous pouvez m'expliquer ?\",\"Mais j'avais répondu à la question !\"],[\"C'est une blague cette note ?\",\"J'ai vraiment travaillé sur ce devoir !\"],[\"JE COMPRENDS PAS VOTRE BARÈME.\",\"Je vais demander à voir ma copie.\"],[\"…\",\"JE… JE… (l'élève ouvre déjà la messagerie)\"]];\nconst P=[\"Très bon travail.\",\"Des efforts sont encore nécessaires.\",\"Attention aux consignes.\",\"Excellent devoir.\",\"Travail catastrophique.\",\"Peut mieux faire.\",\"Des difficultés persistent, mais les efforts sont visibles.\"];\nconst COL=['#2fb344','#8bc34a','#f2c14e','#f08a24','#e5483a','#a1121f'],EM=['😌','🙂','😕','😠','😡','🤬'];\nlet v='copies',cur=null,mode='ok',msgs=[],sens=1,lock=false;\nconst bd=r=>r<20?0:r<40?1:r<60?2:r<80?3:r<95?4:5,emo=r=>EM[bd(r)],R0=Math.round,rnd=a=>a[Math.random()*a.length|0];\nconst gauge=r=>`<div class=g><i style=\"width:${r}%;background:${COL[bd(r)]}\"><\/i><\/div>`;\nconst avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=x=>(Math.round(x*10)/10).toString().replace('.',',');\nconst hr=(s,i)=>{let x=Math.sin(s*97+i*13)*1e4;return x-Math.floor(x)};\nfunction hand(s,t,li){let i=0;return t.replace(/~([^~]+)~|_([^_]+)_|([^\\s~_]+)/g,(m,a,b,c)=>{const k=i++,r=(hr(s.id+li*7,k)-.5)*2*s.f[2],z=1+(hr(s.id+3,k+li)-.5)*.07*s.f[2],st=`display:inline-block;transform:rotate(${r}deg);font-size:${z}em;margin-right:.28em`;return a?`<span class=rat style=\"${st}\">${a}<\/span>`:b?`<span class=und style=\"${st}\">${b}<\/span>`:`<span style=\"${st}\">${c}<\/span>`})}\nconst CMT=[\"À développer\",\"Source ?\",\"Reformuler\"];\nconst gl=m=>!m?'':m=='ok'?'✓':m=='err'?'⚠':'💬 '+m;\nfunction go(k){v=k;cur=null;R()}\nfunction R(){$('#nav').innerHTML=T.map(([k,l])=>`<a class=\"${v==k?'on':''}\" onclick=\"go('${k}')\">${l}${k=='msg'&&msgs.length?`<b>${msgs.length}<\/b>`:''}<\/a>`).join('');$('#main').innerHTML=cur!==null&&v=='copies'?sheet(S[cur]):V[v]()}\nfunction modal(h,l){lock=!!l;$('#md').innerHTML='<div>'+h+'<\/div>';$('#md').classList.add('s')}\nfunction cm(){$('#md').classList.remove('s');lock=false}\nfunction toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',5000)}\nconst tags=s=>`<span class=\"tag ${s.d?'ok':''}\">${s.d?'Corrigée':'À corriger'}<\/span>`;\nconst V={\ndash(){const d=S.filter(s=>s.d);return `<h2>Tableau de bord<\/h2><div class=cards><div class=box><b>${d.length}/${S.length}<\/b><br>copies corrigées<\/div><div class=box><b>${d.length?f1(avg(d.map(s=>s.note))):'–'}/20<\/b><br>moyenne de la classe<\/div><div class=box><b>${S.filter(s=>s.r>=60).length}<\/b><br>élèves très énervés<\/div><div class=box><b>${msgs.length}<\/b><br>messages non lus<\/div><\/div><p class=mu>Objectif : corriger les ${S.length} copies de Seconde 3 sans mettre toute la classe en rage critique.<\/p>`},\neleves(){return `<h2>Élèves<\/h2><div class=cards>${S.map(s=>`<div class=card onclick=\"fiche(${s.id})\"><div class=top><span class=em>${emo(s.r)}<\/span><div><b>${s.p} ${s.n}<\/b><br><small>Moyenne ${f1(avg([...s.fr,...s.ma]))}/20<\/small><\/div><\/div>${gauge(s.r)}<small>Rage ${R0(s.r)}%<\/small><\/div>`).join('')}<\/div>`},\nclasses(){return `<h2>Classes<\/h2><table><tr><th>Classe<th>Effectif<th>Matière<tr><td>Seconde 3<td>10 élèves<td>Français<tr><td>Première 1<td>28 élèves<td>Français<tr><td>Terminale 2<td>25 élèves<td>Français<\/table>`},\ncopies(){return `<h2>Copies à corriger<small>${S.filter(s=>s.d).length}/${S.length} corrigées<\/small><\/h2><div class=cards>${S.map(s=>`<div class=card onclick=\"op(${s.id})\"><div class=top><span class=em>${emo(s.r)}<\/span><div><b>${s.p} ${s.n}<\/b><br><small>Seconde 3 · Français<\/small><\/div>${tags(s)}<\/div><small>Dissertation – coef. 2<\/small>${gauge(s.r)}<small>Rage ${R0(s.r)}%<\/small><\/div>`).join('')}<\/div>`},\nnotes(){return `<h2>Notes<\/h2><table><tr><th>Élève<th>Dissertation<th>Moyenne<th>Rage${S.map(s=>`<tr><td>${s.p} ${s.n}<td>${s.d?s.note+'/20':'–'}<td>${f1(avg([...s.fr,...s.ma]))}<td>${R0(s.r)}%`).join('')}<\/table>`},\nmsg(){return `<h2>Messagerie<\/h2>${msgs.length?msgs.map(m=>`<div class=box style=\"margin-bottom:8px\">${m}<\/div>`).join(''):'<p class=mu>Aucun message. Pour l’instant.<\/p>'}`},\nset(){return `<h2>Paramètres<\/h2><div class=box><label>Sensibilité des élèves : <select onchange=\"sens=+this.value\"><option value=.7 ${sens==.7?'selected':''}>Cool<\/option><option value=1 ${sens==1?'selected':''}>Normale<\/option><option value=1.4 ${sens==1.4?'selected':''}>Susceptible<\/option><\/select><\/label><\/div>`}};\nfunction fiche(i){const s=S[i];modal(`<h3>${s.p} ${s.n}<\/h3><p class=mu>Personnalité : ${s.rev?s.tt:'??? (se révèle après une correction)'}<\/p><b>Français<\/b> : ${s.fr.concat(s.d?[s.note]:[]).join(' / ')}<br><b>Mathématiques<\/b> : ${s.ma.join(' / ')}<br><b>Moyenne générale<\/b> : ${f1(avg([...s.fr,...s.ma]))}/20<br><br><b>Rage actuelle : ${R0(s.r)}%<\/b> ${emo(s.r)}${gauge(s.r)}<button class=go onclick=cm()>Fermer<\/button>`)}\nfunction op(i){cur=i;mode='ok';R()}\nfunction ind(s){const m=s.mk.filter(x=>x);if(!m.length)return 'Annotez les lignes pour obtenir un barème indicatif.';return `Barème indicatif : ${f1(m.filter(x=>x=='ok').length/m.length*20)}/20 d'après vos annotations`}\nfunction sheet(s){const[ff,fs,,fc]=s.f;return `<div class=bar><button onclick=\"cur=null;R()\">← Retour<\/button><b>COPIE DE ${s.p.toUpperCase()} ${s.n.toUpperCase()} <span class=mu>Dissertation · Seconde 3<\/span><\/b>${[['ok','✓ Correct'],['err','⚠ Erreur'],['c','💬 Commenter']].map(([k,l])=>`<button class=\"${mode==k?'on':''}\" onclick=\"mode='${k}';R()\">${l}<\/button>`).join('')}<\/div><div class=work><div class=sw><div class=paper><h4>Sujet : « L'école rend-elle libre ? »<\/h4><div style=\"font-family:'${ff}',cursive;font-size:${fs}px;color:${fc}\">${s.L.map((l,i)=>`<div class=ln onclick=\"mk(${i})\"><span class=gl id=g${i}>${gl(s.mk[i])}<\/span>${hand(s,l[0],i)}${l[1]?`<span class=mg>${l[1].replace('marge: ','')}<\/span>`:''}<\/div>`).join('')}<\/div><\/div><\/div>\n<aside class=pn><h3>CORRECTION<\/h3><label>Note<\/label><div class=nt><input id=note type=number min=0 max=20 step=.5 ${s.d?`disabled value=${s.note}`:'placeholder=\"–\"'}><span>/20<\/span><\/div><small id=ind>${s.d?'':ind(s)}<\/small><label>Appréciation<\/label><textarea id=appr ${s.d?'disabled':''}>${s.d?s.appr:''}<\/textarea>${s.d?'':`<div class=chips>${P.map(p=>`<button onclick=\"$('#appr').value=this.textContent\">${p}<\/button>`).join('')}<\/div><button class=go onclick=\"val()\">🟦 VALIDER LA NOTE<\/button>`}<h4>Rage de ${s.p}<\/h4>${gauge(s.r)}<small>${emo(s.r)} ${R0(s.r)}% · Historique : ${s.fr.concat(s.d?[s.note]:[]).join(', ')}<\/small><\/aside><\/div>`}\nfunction mk(i){const s=S[cur];if(s.d)return;const n=mode=='c'?CMT[(CMT.indexOf(s.mk[i])+1)%3]:mode;s.mk[i]=s.mk[i]==n?null:n;if(mode=='c'&&s.mk[i]==CMT[0]&&false)0;$('#g'+i).textContent=gl(s.mk[i]);$('#ind').textContent=ind(s)}\nfunction val(){const s=S[cur],note=parseFloat(($('#note').value||'').replace(',','.')),ap=$('#appr').value.trim();if(isNaN(note)||note<0||note>20){toast('Saisissez une note entre 0 et 20.');return}\nconst ng=(ap.match(/catastroph|nul|médiocre|décevant|insuffisant|hors.?sujet|peut mieux faire|faible|lamentable|inadmissible|honteux|zéro/gi)||[]).length,ps=(ap.match(/effort|progr|encourag|bravo|très bon|excellent|félicit|courage|sérieux|bien/gi)||[]).length,tone=Math.max(-2,Math.min(2,ps-ng)),tw=s.t=='chat'?2:s.t=='sus'?1.5:1,diff=s.ex-note,others=S.filter(o=>o.d).map(o=>o.note);\nlet d=(diff>0?diff*2.6:diff*1.8)*s.m*1.25;\nif(s.t=='top'&&note<s.lv-3)d*=1.4;if(s.t=='comp'&&others.length)d+=note<Math.max(...others)?10:-8;if(s.t=='work'&&note<10)d+=10;if(s.t=='perf'&&note<18)d+=4;\nd+=tone<0?-tone*9*tw:-tone*6*tw;const last=s.fr[s.fr.length-1];if(last-note>=5)d+=5;\nd=Math.max(-30,Math.min(40,(d+(Math.random()*4-2))*sens));const old=s.r;s.r=Math.max(0,Math.min(100,old+d));\ns.d=true;s.note=note;s.appr=ap;s.rev=true;const nn=f1(note),b=bd(s.r);let say;\nif(note>=15&&tone<0)say=`${nn} ET ${(ap.replace(/[.!]+$/,'')||'??').toUpperCase()} ???`;\nelse if(d<=-6&&b<2)say=rnd(s.g).replace('{n}',nn);else if(b>=2&&Math.random()<.55)say=rnd(s.b).replace('{n}',nn);else if(b<2&&Math.random()<.4)say=rnd(s.g).replace('{n}',nn);else say=rnd(G[b]);\nconst crit=s.r>=95;let ev=null;if(crit)ev=critEv(s);else if(s.r>=40&&Math.random()<(s.r-30)/140)ev=ev1(s);\nif(ev)msgs.unshift(ev);\nconst all=S.every(x=>x.d);\nmodal(`<h3>💬 RÉACTION DE L'ÉLÈVE<\/h3><p>Note : <b>${nn}/20<\/b>${ap?` · « ${ap} »`:''}<\/p><div class=say><b>${s.p}<\/b> ${emo(s.r)} :<br>« ${say} »<\/div><p>Rage : ${R0(old)}% → <b>${R0(s.r)}%<\/b><\/p>${gauge(old).replace('<i ','<i id=rb ')}${ev?`<div class=box style=\"margin:10px 0;border-color:${crit?'#a1121f':'var(--hl)'}\"><b>${crit?'🚨 ÉTAT CRITIQUE':'Événement'}<\/b><br>${ev}<\/div>`:''}<button class=go onclick=\"${all?'bilan()':'cm();cur=null;R()'}\">${all?'Voir le bilan de la journée':'Copie suivante'}<\/button>`,1);\nsetTimeout(()=>{const e=$('#rb');if(e){e.style.width=s.r+'%';e.style.background=COL[b]}},60);R()}\nfunction ev1(s){const o=rnd(S.filter(x=>x!=s)),on=o.d?o.note:11;return rnd([`📱 Nouveau message de ${s.p} : « Pourquoi j'ai eu ${f1(s.note)} alors que ${o.p} a eu ${on} ? »`,`📧 Message d'un parent (${s.p} ${s.n}) : « Bonjour, pourriez-vous nous expliquer la note attribuée à notre enfant ? »`,`🗣️ ${s.p} demande à revoir sa copie.`])}\nfunction critEv(s){return rnd([`🏛️ Un conseil de classe fictif est convoqué pour examiner le cas de ${s.p}.`,`📣 ${s.p} lance la pétition « Pour un barème transparent » (2 signatures, dont sa mère).`,`🗓️ ${s.p} réclame un rendez-vous urgent « avant la sonnerie » et a prévenu ses parents.`,`📧 Les parents de ${s.p} exigent une justification écrite en trois exemplaires.`])}\nfunction bilan(){const c=s=>S.filter(x=>x.r>=s[0]&&x.r<s[1]).length;lock=false;modal(`<h3>BILAN DE LA JOURNÉE<\/h3>Copies corrigées : <b>${S.filter(s=>s.d).length}/${S.length}<\/b><br>Moyenne de la classe : <b>${f1(avg(S.map(s=>s.note)))}/20<\/b><br>Élèves satisfaits : <b>${c([0,30])}<\/b><br>Élèves frustrés : <b>${c([30,60])}<\/b><br>Élèves très énervés : <b>${c([60,95])}<\/b><br>Élèves en rage critique : <b>${c([95,101])}<\/b><p class=mu>${c([95,101])?'Vos messages vont chauffer. Prévoyez des tisanes.':c([60,95])>2?'Une journée tendue, mais la salle des profs vous attend.':'Journée maîtrisée : la classe vous salue (presque).'}<\/p><button class=go onclick=\"location.reload()\">Rejouer<\/button>`,1)}\nR();\n<\/script><\/body><\/html>\n"},{...{"id": "mouse-panic", "title": "MOUSE PANIC", "tag": "ARCADE · RÉFLEXES", "icon": "🐭", "color": "#ff4d6d", "desc": "Une souris en panique, des clics à toute vitesse : combos, records et succès.", "long": "Dans MOUSE PANIC, tout est une question de vitesse : clique le plus vite possible, enchaîne les combos et bats tes records. Ta souris change d'humeur selon ton rythme.", "feats": ["⚡ Score, combo et clics/seconde", "🐭 Une souris qui réagit à tes actions", "🏅 Records et succès", "📱 Jouable au doigt ou à la souris"], "goals": [], "ranks": []},html:"<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<title>MOUSE PANIC<\/title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap\">\n<style>\n:root{--bg:#0d0b14;--panel:#17131f;--line:#2c2540;--ink:#f3effa;--dim:#8d83a6;--violet:#8b5cf6;--hot:#ff4d6d;--gold:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*,*::before,*::after{box-sizing:inherit}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nhtml,body{height:100%;margin:0}\nbody{background:radial-gradient(ellipse at 50% 40%,#1c1530 0,var(--bg) 70%);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}\n#app{height:100%;display:flex;flex-direction:column;position:relative}\n/* En-tête : score | combo | clics/sec */\nheader{display:flex;justify-content:space-around;align-items:flex-end;padding:14px 8px 8px;border-bottom:1px solid var(--line);position:relative}\n.st{text-align:center;min-width:0}.st b{display:block;font-size:clamp(26px,7vw,46px);line-height:1;font-variant-numeric:tabular-nums}.st small{color:var(--dim);font-size:12px}\n#combo{color:var(--violet)}\n#snd{position:absolute;right:8px;top:6px;background:none;border:0;font-size:18px;cursor:pointer;color:var(--ink);padding:4px}\n#bar{height:5px;background:var(--line)}#bar i{display:block;height:100%;width:100%;background:var(--violet);transition:width .1s linear}\n#bar.low i{background:var(--hot)}\n#banner{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:700;font-size:clamp(18px,5vw,28px);color:var(--gold);pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}\n#banner.on{opacity:1}\n/* Arène */\nmain{flex:1;position:relative;overflow:hidden;min-height:0}\n#rec{position:absolute;top:10px;left:0;right:0;text-align:center;color:var(--dim);font-size:14px}\n#rec b{display:block;color:var(--ink);font-size:clamp(22px,5vw,32px)}\n.wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:left .25s,top .25s;z-index:2}\n.wrap.fast{transition:left .08s,top .08s}.wrap.slowmo{transition:left .8s,top .8s}\n#face{display:block;text-align:center;font-size:clamp(28px,7vmin,48px);height:1.2em}\n#say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;max-width:90vw}\n#say.on{opacity:1}\n.mouse{display:block;background:none;border:0;padding:0;font-size:clamp(100px,28vmin,210px);line-height:1;cursor:pointer;filter:drop-shadow(0 0 22px rgba(139,92,246,.55));transition:transform .15s,filter .2s}\n.mouse:active{transform:scale(.88)}.mouse:focus-visible{outline:3px solid var(--violet);outline-offset:6px;border-radius:50%}\n.m1 .mouse{animation:sh .12s infinite}.m2 .mouse{animation:sh .06s infinite;filter:drop-shadow(0 0 26px rgba(255,77,109,.7))}\n.m3 .mouse{animation:sh .04s infinite;filter:drop-shadow(0 0 34px #ff4d6d)}\n.tiny .mouse{transform:scale(.45)}\n.gold .mouse{filter:drop-shadow(0 0 40px var(--gold)) saturate(1.8) sepia(.6)}\n.fake .mouse{filter:grayscale(1) opacity(.75)}\n@keyframes sh{0%{translate:0 0}25%{translate:-3px 2px}50%{translate:3px -2px}75%{translate:-2px -3px}100%{translate:0 0}}\nbody.quake main{animation:q .09s infinite}\n@keyframes q{0%{translate:0 0}33%{translate:3px -3px}66%{translate:-3px 3px}100%{translate:0 0}}\n#cnt{position:absolute;bottom:14px;left:0;right:0;text-align:center;pointer-events:none}\n#cnt b{display:block;font-size:clamp(34px,8vw,56px);line-height:1;font-variant-numeric:tabular-nums}\n#cnt small{color:var(--dim)}#ttl{color:var(--violet);font-weight:700;display:block;min-height:1.3em}\n.fx{position:absolute;pointer-events:none;font-weight:700;z-index:4;animation:fly .7s ease-out forwards;white-space:nowrap}\n@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}\n/* Écrans */\n#ov{position:absolute;inset:0;background:rgba(8,6,14,.88);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;overflow:auto}\n#ov.hide{display:none}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:430px;width:100%;text-align:center;animation:pop .25s}\n.card.rec{border-color:var(--gold);animation:pop .3s,glow 1s infinite alternate}\n@keyframes pop{from{transform:scale(.85);opacity:0}}\n@keyframes glow{to{box-shadow:0 0 50px rgba(251,191,36,.5)}}\n.card h1{margin:0 0 8px;font-size:clamp(34px,10vw,52px);letter-spacing:1px}\n.card h2{margin:0 0 12px;font-size:28px}\n.card p{color:var(--dim);margin:8px 0 16px;line-height:1.45}\n.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);text-align:left;gap:12px}.row b{text-align:right}\n.btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:700 16px 'Chakra Petch',system-ui,sans-serif;cursor:pointer}\n.btn.main{background:var(--violet);border-color:var(--violet);font-size:20px}.btn:hover{filter:brightness(1.2)}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n.lock{opacity:.4}\n#toast{position:absolute;top:12px;left:50%;translate:-50% -150%;background:var(--violet);padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;transition:translate .35s cubic-bezier(.3,1.6,.5,1);text-align:center}\n#toast.on{translate:-50% 0}\n@media (prefers-reduced-motion:reduce){.mouse,.card,body.quake main{animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <header>\n    <div class=\"st\"><b id=\"score\">0<\/b><small>SCORE<\/small><\/div>\n    <div class=\"st\"><b id=\"combo\">x1<\/b><small>COMBO<\/small><\/div>\n    <div class=\"st\"><b id=\"cps\">0<\/b><small>CLICS/SEC<\/small><\/div>\n    <button id=\"snd\" aria-label=\"Son\">🔊<\/button>\n  <\/header>\n  <div id=\"bar\"><i><\/i><\/div>\n  <div id=\"banner\"><\/div>\n  <main id=\"arena\">\n    <div id=\"rec\">🏆 RECORD PERSONNEL<b id=\"recv\">0<\/b><\/div>\n    <div class=\"wrap\" id=\"wrap\"><div id=\"say\"><\/div><span id=\"face\">😐<\/span><button class=\"mouse\" id=\"mouse\" aria-label=\"Souris\">🐭<\/button><\/div>\n    <div class=\"wrap fake\" id=\"fk\" style=\"display:none\"><button class=\"mouse\" id=\"fkb\" aria-label=\"Fausse souris\">🐭<\/button><\/div>\n    <div id=\"cnt\"><b id=\"clk\">0<\/b><small>CLICS<\/small><span id=\"ttl\"><\/span><\/div>\n  <\/main>\n  <div id=\"ov\"><\/div>\n  <div id=\"toast\"><\/div>\n<\/div>\n<script>\n/* ===== MOUSE PANIC ===== */\nconst $=s=>document.querySelector(s), fmt=n=>Math.round(n).toLocaleString('fr-FR'), rnd=(a,b)=>a+Math.random()*(b-a);\n\n/* ---------- Sauvegarde (localStorage) ---------- */\nconst SK='mousepanic_v1', DEF={clicks:0,best:0,bestCombo:1,bestCps:0,games:0,time:0,records:0,ach:{}};\nlet S=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){return {...DEF}}})();\nconst save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};\n\n/* ---------- Sons (Web Audio) ---------- */\nlet AC,mute=false;\nfunction beep(f,d=.06,type='square',v=.05,to){\n  if(mute)return;\n  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();\n  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);\n  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}\n}\nconst sfx={\n  rec:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.08),i*110)),\n  up:()=>{beep(440,.1,'triangle',.07,880)},\n  panic:()=>{beep(120,.5,'sawtooth',.08,900)},\n  bad:()=>beep(200,.25,'sawtooth',.07,60),\n  squeak:()=>beep(900,.12,'sine',.06,1500),\n  ev:()=>beep(600,.15,'triangle',.06,300)\n};\n$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊'};\n\n/* ---------- Données de jeu ---------- */\nconst TITLES=[[50000,\"TU N'AS PLUS DE VIE\"],[10000,'LÉGENDE'],[5000,'Psychopathe du clic'],[1000,'Machine à clics'],[500,'Cliqueur'],[100,'Amateur']];\nconst MOODS=[{f:'😐'},{f:'😠'},{f:'🤬'},{f:'💀'}];\nconst LINES=['ARRÊTE.','MAIS POURQUOI TU CLIQUES AUTANT ?','J\\'AI COMPRIS 😭','TU VEUX MON RECORD OU QUOI ?','AÏE.','ENCORE ?!','PITIÉ 🧀','J\\'AI UNE FAMILLE !'];\nconst EVENTS={\n  slow:{n:'🐌 MODE LENT — tout ralentit',d:6},\n  turbo:{n:'⚡ MODE TURBO — points x3',d:5},\n  chaos:{n:'🌀 MODE CHAOS — elle bouge !',d:5},\n  fake:{n:'👻 FAUSSE SOURIS — ne clique pas dessus !',d:6},\n  mega:{n:'💥 MEGA CLIC — clique sur la dorée !',d:4},\n  trap:{n:'😈 PIÈGE — méfie-toi du calme...',d:3}\n};\nconst ACH=[\n  ['first','🖱️','Premier clic','Cliquer une première fois',()=>S.clicks>=1],\n  ['fast','⚡','Rapide','Atteindre 10 clics/seconde',()=>S.bestCps>=10],\n  ['combo','🔥','COMBO','Atteindre x10',()=>S.bestCombo>=10],\n  ['insist','💀','Insistant','10 000 clics au total',()=>S.clicks>=10000],\n  ['legend','👑','LÉGENDE','Battre un score de 50 000',()=>S.best>=50000],\n  ['why','🤨','Pourquoi ?','Jouer très longtemps (30 min)',()=>S.time>=1800]\n];\nlet g={on:false}, toastQ=[];\n\n/* ---------- Utilitaires d'affichage ---------- */\nconst mult=s=>s>=100?10:s>=50?5:s>=25?3:s>=10?2:1;\nconst titleFor=()=>(TITLES.find(t=>S.clicks>=t[0])||[0,''])[1];\nfunction say(t,ms=1500){const e=$('#say');e.textContent=t;e.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove('on'),ms)}\nfunction banner(t){const b=$('#banner');b.textContent=t;b.classList.add('on');clearTimeout(banner.t);banner.t=setTimeout(()=>b.classList.remove('on'),2200)}\nfunction fx(x,y,txt,n=1,color){\n  const m=$('#arena').getBoundingClientRect();\n  for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fx';e.textContent=txt;\n    e.style.left=(x-m.left)+'px';e.style.top=(y-m.top)+'px';e.style.color=color||'var(--ink)';\n    e.style.setProperty('--dx',rnd(-80,80)+'px');e.style.setProperty('--dy',rnd(-110,-20)+'px');\n    $('#arena').appendChild(e);setTimeout(()=>e.remove(),700)}\n}\nfunction toast(t){toastQ.push(t);if(!toast.b)nextToast()}\nfunction nextToast(){const t=toastQ.shift();if(!t){toast.b=false;return}toast.b=true;const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>{e.classList.remove('on');setTimeout(nextToast,400)},2200)}\nfunction checkAch(){ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=1;sfx.up();toast('🏅 Succès : '+a[1]+' '+a[2]);save()}})}\n\n/* ---------- Souris : position et humeur ---------- */\nfunction place(x,y,fast){const w=$('#wrap');w.classList.toggle('fast',!!fast);w.style.left=x+'%';w.style.top=y+'%'}\nfunction jump(){\n  const mood=g.mood, far=mood>=2||g.ev==='chaos';\n  place(far?rnd(18,82):rnd(38,62),far?rnd(28,72):rnd(42,58),g.mood>=2||g.ev==='chaos');\n  if(mood===2&&Math.random()<.4){const w=$('#wrap');w.classList.add('tiny');setTimeout(()=>w.classList.remove('tiny'),1200)}\n}\nfunction setMood(m){\n  if(m===g.mood)return;\n  const up=m>g.mood;g.mood=m;\n  const w=$('#wrap');w.classList.remove('m1','m2','m3');if(m)w.classList.add('m'+m);\n  $('#face').textContent=MOODS[m].f;\n  document.body.classList.toggle('quake',m===3);\n  if(up&&m>0){ if(m===3){sfx.panic();banner('💀 PANIC MODE 💀');say('AAAAAH !!!',1800)}else{sfx.up();say(LINES[Math.floor(rnd(0,LINES.length))])} }\n  if(m===0)place(50,50);\n}\n\n/* ---------- Événements aléatoires ---------- */\nfunction startEvent(k){\n  endEvent();const e=EVENTS[k];g.ev=k;g.evEnd=g.el+e.d;banner(e.n);sfx.ev();\n  const w=$('#wrap');\n  if(k==='slow')w.classList.add('slowmo');\n  if(k==='mega')w.classList.add('gold');\n  if(k==='fake'){const f=$('#fk');f.style.display='block';moveFake()}\n  if(k==='trap'){place(50,50);w.classList.add('tiny');w.classList.remove('tiny');say('...zzz 😴',2000);\n    setTimeout(()=>{if(g.on&&g.ev==='trap'){place(rnd(12,88),rnd(30,70),true);say('SURPRISE !',900);sfx.squeak()}},1800)}\n}\nfunction endEvent(){\n  g.ev=null;const w=$('#wrap');w.classList.remove('slowmo','gold');$('#fk').style.display='none';\n}\nfunction moveFake(){const f=$('#fk');f.style.left=rnd(15,85)+'%';f.style.top=rnd(30,70)+'%'}\n\n/* ---------- Boucle principale (100 ms) ---------- */\nfunction tick(){\n  if(!g.on)return;\n  const now=performance.now();\n  g.t-=.1;g.el+=.1;S.time+=.1;g.mv+=100;\n  g.stamps=g.stamps.filter(x=>now-x<1000);g.cps=g.stamps.length;\n  if(g.cps>g.maxCps)g.maxCps=g.cps;\n  // Le combo retombe progressivement si on arrête de cliquer\n  if(now-g.last>1200&&g.streak>0)g.streak=Math.max(0,g.streak-(g.ev==='slow'?.5:1));\n  const m=mult(g.streak);\n  if(m>g.bestCombo)g.bestCombo=m;\n  setMood(g.streak>=50?3:g.streak>=30?2:g.streak>=10?1:0);\n  // Mouvements selon l'humeur\n  const iv=([0,1300,650,320][g.mood])*(g.ev==='slow'?2.5:1), civ=g.ev==='chaos'?300:iv;\n  if(g.ev!=='trap'&&civ>0&&g.mv>=civ){g.mv=0;jump()}\n  // Événements\n  if(g.ev&&g.el>=g.evEnd)endEvent();\n  if(!g.ev&&g.el>=g.nextEv){const ks=Object.keys(EVENTS);startEvent(ks[Math.floor(rnd(0,ks.length))]);g.nextEv=g.el+rnd(9,14)}\n  if(g.ev==='fake'&&Math.round(g.el*10)%9===0)moveFake();\n  render();\n  if(g.t<=0)end();\n}\nfunction render(){\n  $('#score').textContent=fmt(g.score);$('#combo').textContent='x'+mult(g.streak);\n  $('#cps').textContent=g.cps;$('#clk').textContent=fmt(g.clicks);$('#ttl').textContent=titleFor();\n  $('#bar i').style.width=Math.max(0,g.t/30*100)+'%';$('#bar').classList.toggle('low',g.t<6);\n  $('#recv').textContent=fmt(Math.max(S.best,g.score));\n}\n\n/* ---------- Clic sur la souris ---------- */\nfunction hit(e){\n  if(!g.on)return;\n  const now=performance.now(),m=mult(g.streak);\n  g.last=now;g.stamps.push(now);g.streak++;g.clicks++;S.clicks++;\n  const was=g.streak>0&&mult(g.streak-1)<mult(g.streak);\n  let pts=m*(g.ev==='turbo'?3:1),label='+'+pts,col='var(--ink)';\n  if(g.ev==='mega'){pts=100*m;label='💥 +'+fmt(pts);col='var(--gold)';endEvent();sfx.rec()}\n  g.score+=pts;\n  // Bonus de temps : +1 s tous les 8 clics (dès x2)\n  if(g.streak>=10&&g.clicks%8===0)g.t=Math.min(30,g.t+1);\n  // Son : plus aigu et plus court quand le combo monte\n  beep(260+Math.min(g.streak,120)*9,Math.max(.025,.07-g.streak*.0004),g.mood>=2?'sawtooth':'square',.04);\n  if(was){sfx.up();banner('COMBO x'+mult(g.streak)+' !')}\n  const x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2;\n  fx(x,y,label,1,col);\n  if(g.mood>=1)fx(x,y,['✨','💢','⚡','💥'][g.mood],g.mood+1,'var(--hot)');\n  if(g.mood>=2&&g.clicks%12===0){say(LINES[Math.floor(rnd(0,LINES.length))]);sfx.squeak()}\n  if(g.mood===3)jump();\n  render();checkAch();\n}\nconst bind=(el,fn)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();fn(e)});el.addEventListener('click',e=>{if(e.detail===0)fn(e)})};\nbind($('#mouse'),hit);\nbind($('#fkb'),e=>{ // La fausse souris ne rapporte rien et casse le combo\n  if(!g.on)return;g.streak=Math.floor(g.streak/2);sfx.bad();fx(e.clientX,e.clientY,'FAUX ! 👻',1,'var(--hot)');moveFake();\n});\n\n/* ---------- Début / fin de partie ---------- */\nfunction start(){\n  g={on:true,score:0,clicks:0,streak:0,bestCombo:1,maxCps:0,cps:0,stamps:[],last:0,t:20,el:0,mv:0,mood:-1,ev:null,evEnd:0,nextEv:rnd(7,10)};\n  endEvent();setMood(0);document.body.classList.remove('quake');place(50,50);\n  $('#ov').classList.add('hide');banner('CLIQUE !');render();\n  clearInterval(start.iv);start.iv=setInterval(tick,100);\n}\nfunction end(){\n  g.on=false;clearInterval(start.iv);endEvent();document.body.classList.remove('quake');\n  const isRec=g.score>S.best&&g.score>0, prev=S.best;\n  S.games++;S.bestCombo=Math.max(S.bestCombo,g.bestCombo);S.bestCps=Math.max(S.bestCps,g.maxCps);\n  if(isRec){S.best=g.score;S.records++}\n  checkAch();save();\n  if(isRec){sfx.rec();const m=$('#arena').getBoundingClientRect();for(let i=0;i<30;i++)setTimeout(()=>fx(rnd(m.left,m.right),rnd(m.top+80,m.bottom-40),['🔥','🏆','✨','🎉'][i%4],1),i*25)}\n  show(isRec\n   ?`<div class=\"card rec\"><h2>🔥 NOUVEAU RECORD 🔥<\/h2><div class=\"row\"><span>Score<\/span><b>${fmt(g.score)}<\/b><\/div><div class=\"row\"><span>Ancien record<\/span><b>${fmt(prev)}<\/b><\/div><div class=\"row\"><span>Meilleur combo<\/span><b>x${g.bestCombo}<\/b><\/div><div class=\"row\"><span>Clics/sec<\/span><b>${g.maxCps}<\/b><\/div><button class=\"btn main\" id=\"go\">ENCORE PLUS LOIN<\/button>${menu()}<\/div>`\n   :`<div class=\"card\"><h2>GAME OVER<\/h2><div class=\"row\"><span>Score<\/span><b>${fmt(g.score)}<\/b><\/div><div class=\"row\"><span>Record<\/span><b>${fmt(S.best)}<\/b><\/div><div class=\"row\"><span>Meilleur combo<\/span><b>x${g.bestCombo}<\/b><\/div><div class=\"row\"><span>Clics/sec<\/span><b>${g.maxCps}<\/b><\/div><p>❌ Tu n'as pas battu ton record.${S.best?' Il te manque '+fmt(S.best-g.score+1)+' points.':''}<\/p><button class=\"btn main\" id=\"go\">REJOUER<\/button>${menu()}<\/div>`);\n  $('#go').onclick=start;\n}\n\n/* ---------- Écrans ---------- */\nconst menu=()=>`<button class=\"btn\" id=\"bs\">STATISTIQUES<\/button><button class=\"btn\" id=\"ba\">SUCCÈS<\/button>`;\nfunction show(html){const o=$('#ov');o.innerHTML=html;o.classList.remove('hide');\n  const s=$('#bs'),a=$('#ba');if(s)s.onclick=stats;if(a)a.onclick=achs}\nfunction home(){\n  show(`<div class=\"card\"><h1>MOUSE PANIC<\/h1><p>Clique sur la souris le plus vite possible. Plus tu cliques, plus elle s'énerve.<br>Ton temps s'épuise : à partir de x2, chaque série de 8 clics te rend 1 seconde.<\/p><button class=\"btn main\" id=\"go\">JOUER<\/button>${menu()}<\/div>`);\n  $('#go').onclick=start;\n}\nfunction stats(){\n  const h=Math.floor(S.time/3600),mi=Math.floor(S.time%3600/60),se=Math.floor(S.time%60);\n  const r=[['Clics au total',fmt(S.clicks)],['Meilleur score',fmt(S.best)],['Meilleur combo','x'+S.bestCombo],['Meilleur clics/sec',S.bestCps],['Parties jouées',S.games],['Temps total',(h?h+' h ':'')+mi+' min '+se+' s'],['Records battus',S.records]];\n  show(`<div class=\"card\"><h2>STATISTIQUES<\/h2>${r.map(x=>`<div class=\"row\"><span>${x[0]}<\/span><b>${x[1]}<\/b><\/div>`).join('')}<button class=\"btn main\" id=\"bk\">RETOUR<\/button><\/div>`);\n  $('#bk').onclick=back;\n}\nfunction achs(){\n  show(`<div class=\"card\"><h2>SUCCÈS<\/h2>${ACH.map(a=>{const u=S.ach[a[0]];return `<div class=\"row ${u?'':'lock'}\"><span>${u?a[1]+' '+a[2]:'🔒 ???'}<\/span><b style=\"font-weight:500;font-size:13px\">${u?a[3]:'Caché'}<\/b><\/div>`}).join('')}<button class=\"btn main\" id=\"bk\">RETOUR<\/button><\/div>`);\n  $('#bk').onclick=back;\n}\nconst back=home;\n\n/* ---------- Initialisation ---------- */\n$('#recv').textContent=fmt(S.best);\nhome();\n<\/script>\n<\/body>\n<\/html>\n"}];
const $=s=>document.querySelector(s),grid=$("#grid"),pl=$("#player"),fr=$("#frame");
function open_(g){$("#ptitle").textContent=g.title;fr.srcdoc=g.html;pl.classList.add("on")}
function sheet(g){const b=$("#box");b.style.setProperty("--c",g.color);
b.innerHTML=`<div class="cover" style="--c:${g.color}">${g.icon}</div><div class="body"><button class="x" aria-label="Fermer">✕</button><div class="tag">${g.tag}</div><h3>${g.title}</h3><p>${g.long}</p><h4>FONCTIONNALITÉS</h4><div class="chips">${g.feats.map(f=>`<span>${f}</span>`).join("")}</div>${g.goals.length?`<h4>🏆 SUCCÈS À DÉBLOQUER</h4><div class="chips">${g.goals.map(f=>`<span>${f}</span>`).join("")}</div>`:""}${g.ranks.length?`<h4>PALIERS DE SOUFFRANCE</h4><div class="rk">${g.ranks.map(r=>`<b>${r[0]}+</b><span>${r[1]}</span>`).join("")}</div>`:""}<button class="play big">▶ Jouer maintenant</button></div>`;
b.querySelector(".x").onclick=()=>$("#sheet").classList.remove("on");b.querySelector(".big").onclick=()=>{$("#sheet").classList.remove("on");open_(g)};$("#sheet").classList.add("on")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")e.target.classList.remove("on")};
function close_(){pl.classList.remove("on");fr.srcdoc=""}
GAMES.forEach(g=>{const d=document.createElement("div");d.className="card";d.style.setProperty("--c",g.color);
d.innerHTML=`<div class="in"><div class="cover">${g.icon}</div><div class="body"><div class="tag">${g.tag}</div><h3>${g.title}</h3><p>${g.desc}</p><span class="play">▶ Jouer</span></div></div>`;
d.onclick=()=>sheet(g);grid.appendChild(d)});
const s=document.createElement("div");s.className="card soon";s.style.setProperty("--c","#8b5cf6");
s.innerHTML=`<div class="in"><div class="cover">🔒</div><div class="body"><div class="tag">BIENTÔT</div><h3>Prochain jeu</h3><p>Envoie-moi le suivant, je l'ajoute ici.</p></div></div>`;grid.appendChild(s);
$("#count").textContent=GAMES.length+" jeu"+(GAMES.length>1?"x":"")+" disponible"+(GAMES.length>1?"s":"");

</script></body></html>
